[package]
name = "r-name"
version = "0.1.0"
edition = "2021"
description = "CLI minimalista para renombrar archivos en masa de forma segura"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
jwalk = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
kamadak-exif = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.10"
